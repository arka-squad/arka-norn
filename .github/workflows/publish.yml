name: publish-npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12.0.2

      - name: Verify tag and package version
        run: >-
          node -e 'const expected = `v${require("./package.json").version}`;
          if (process.env.RELEASE_TAG !== expected) {
          console.error(`Release tag ${process.env.RELEASE_TAG} does not match ${expected}.`);
          process.exit(1); }'

      - name: Install dependencies
        run: npm ci

      - name: Run the release gates
        run: npm run release:verify

      - name: Publish with npm Trusted Publishing
        run: npm publish --access public

      - name: Verify the registry version
        run: >-
          node -e 'const { execFileSync } = require("node:child_process");
          const version = require("./package.json").version;
          const published = execFileSync("npm", ["view", `arka-norn@${version}`, "version"],
          { encoding: "utf8" }).trim();
          if (published !== version) {
          console.error(`Registry returned ${published || "nothing"}; expected ${version}.`);
          process.exit(1); }'
